name: Nebo SonarQube
on:
  push:
    paths:
      - 'sut/**'
      - '.github/workflows/sonarqube.yml'
      - 'quality/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: sut
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sut/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Start isolated SonarQube Community Build
        id: sonar
        shell: bash
        run: bash ../quality/start-sonar.sh
      - name: Analyze storefront and import backend LCOV
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}
          SONAR_HOST_URL: http://127.0.0.1:9036
        with:
          projectBaseDir: sut
          args: -Dsonar.scm.disabled=true
      - name: Export analysis results
        shell: bash
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}
          SONAR_HOST_URL: http://127.0.0.1:9036
        run: node ../quality/export-sonar.mjs ../sonar-results
      - name: Save scanner results
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-results
          path: |
            sonar-results/
            sut/.scannerwork/report-task.txt
      - name: Print server diagnostics on failure
        if: failure()
        run: docker logs --tail 80 ec4206-sonar || true
