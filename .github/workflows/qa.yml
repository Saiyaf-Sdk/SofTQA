name: Nebo QA
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sut/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - run: npm run test:e2e
      - run: npm run test:bdd
      - run: npm run test:postman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-execution-artifacts
          path: |
            sut/coverage/
            sut/test-results/
